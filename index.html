<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beginning CS</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #f4f5f7; color: #1d2330;
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
header { background: #1d2330; color: #fff; padding: 18px 16px; }
header h1 { margin: 0; font-size: 1.5rem; }
header p { margin: 4px 0 0; color: #c9cfdb; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
h2 { font-size: 1.1rem; margin: 8px 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
a.card { display: block; background: #fff; border: 1px solid #d9dde5; border-radius: 10px; padding: 16px; color: inherit; text-decoration: none; }
a.card:hover { border-color: #2f6fdb; }
a.card b { display: block; font-size: 1.05rem; margin-bottom: 4px; }
a.card span { color: #5b6475; }
</style>
</head>
<body>
<header>
  <h1>Beginning CS</h1>
  <p>Practice pages for Snap!</p>
</header>
<main>
  <h2>Quest make-ups</h2>
  <div class="cards">
    <a class="card" href="quest5.html"><b>Quest 5: Map, Keep, Combine</b><span>Work through every quest problem and earn points back.</span></a>
  </div>
</main>
</body>
</html>
